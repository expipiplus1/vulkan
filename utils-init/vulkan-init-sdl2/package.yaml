name: vulkan-init-sdl2
version: "0.1.0.0"
synopsis: Vulkan initialization helpers for SDL2
category: Graphics
maintainer: IC Rainbow <aenor.realm@gmail.com>
license: BSD-3-Clause
license-file: LICENSE
github: haskell-game/vulkan
extra-source-files:
- readme.md
- changelog.md
- package.yaml

library:
  source-dirs: src
  dependencies:
  - base <5
  - bytestring
  - resourcet >= 1.2.4
  - sdl2 >= 2.5 && < 2.6
  - text
  - vector
  - vulkan >= 3.6.14 && < 3.28
  - vulkan-utils

ghc-options:
- -Wall

default-extensions:
- DerivingStrategies
- FlexibleContexts
- LambdaCase
- NamedFieldPuns
- OverloadedStrings
- PatternSynonyms
- RankNTypes
- RecordWildCards
- ScopedTypeVariables
